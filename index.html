 P=(a.data||[]).sort((x,y)=>(new Date(y.boost_until)>new Date())-(new Date(x.boost_until)>new Date()));F=Object.fromEntries((b.data||[]).map(f=>[f.id,f]));C=c.data||[];S=d.data||{};dbg=[["products",a],["farmers",b],["categories",c],["settings",d]].filter(x=>x[1].error).map(x=>x[0]+": "+x[1].error.message).join("; ");

function shop(){const raw=($("#q")||{}).value||"",q=raw.toLowerCase(),A=$("#app"),live=P.filter(p=>p.stock>0),boost=p=>new Date(p.boost_until)>new Date(),catOk=p=>fc=="All"||p.category==fc,chips=arr=>{const cs=C.filter(c=>arr.some(p=>p.category==c.name));return cs.length>1?`<div class="chips"><button class="chip ${fc=="All"?"on":""}" data-fcat="All">All</button>${cs.map(c=>`<button class="chip ${fc==c.name?"on":""}" data-fcat="${esc(c.name)}">${esc(c.icon)} ${esc(c.name)}</button>`).join("")}</div>`:""};
 if(cf){const f=F[cf]||{},ps0=live.filter(p=>p.farmer_id==cf),ps=ps0.filter(catOk);
  A.innerHTML=`${banner()}<button class="del" data-back>← All farmers</button><h1>${esc(f.farm||"Farm")}</h1><p class="mute">${esc(f.town||"")}${ps[0]?` · <button class="del" data-rep="${ps[0].id}" style="font-size:.78rem">Report farmer</button>`:""}</p>${chips(ps0)}<div class="grid">${ps.map(p=>`<div class="card"><div class="big">${esc(C.find(c=>c.name==p.category)?.icon||"🌱")}</div><b>${esc(p.name)}${boost(p)?" ⭐":""}</b><div class="row"><b>${money(p.price)}<small>/${esc(p.unit)}</small></b><span>${cart[p.id]?`<button class="del" data-dec="${p.id}">−</button> ${cart[p.id]} `:""}<button class="btn sm" data-inc="${p.id}">+</button></span></div></div>`).join("")||(ps0.length?'<p class="mute">Nothing in this category. <button class="del" data-fcat="All">Show all items</button></p>':"<p class='mute'>This farmer has nothing in stock right now.</p>")}</div>${total()>0?basket():""}`;return}
 const g={};live.filter(catOk).forEach(p=>(g[p.farmer_id]=g[p.farmer_id]||[]).push(p));

function basket(){return `<form id="co" class="box"><h2>Your order: ${money(total())}</h2><p class="mute">Order from ${esc(F[cf]?.farm||"this farmer")}. Want something from another farmer? Go back and order from them separately.</p><input name="name" placeholder="Your name" required><input name="phone" type="tel" placeholder="Phone number" required><input name="address" placeholder="Delivery address" required><input name="email" type="email" placeholder="Email (for the online payment receipt)"><label><input type="radio" name="method" value="online" checked style="width:auto;margin-right:8px">Pay online (card, transfer, USSD)</label><br><label><input type="radio" name="method" value="cod" style="width:auto;margin:8px 8px 10px 0">Pay on delivery</label>${msg?`<p class="mute" role="alert">${esc(msg)}</p>`:""}<button class="btn">Place order</button></form>`}
function sell(){const A=$("#app");if(!user){A.innerHTML=`<h1>Sell your harvest.</h1><form id="login" class="box"><p class="mute">Log in, or create an account with your email and a password.</p><input name="email" type="email" placeholder="Email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" required><input name="password" type="password" minlength="6" placeholder="Password (at least 6 characters)" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required><label class="mute"><input type="checkbox" style="width:auto;margin:0 8px 12px 0" onchange="this.closest('form').password.type=this.checked?'text':'password'">Show password</label><button class="btn" value="in">Log in</button><button class="btn" value="up" style="margin-top:8px;background:none;color:var(--g);border:1px solid var(--g)">Create account</button>${msg?`<p class="mute">${esc(msg)}</p>`:""}</form>`;return}
 if(!me){A.innerHTML=`<h1>Create your farm account.</h1><form id="prof" class="box"><input name="farm" placeholder="Farm name" required><input name="town" placeholder="Town or area" required><input name="phone" placeholder="Phone for orders" required>${msg?`<p class="mute" role="alert">${esc(msg)}</p>`:""}<button class="btn">Create account</button></form>`;return}
 const sub=me.sub_until&&new Date(me.sub_until)>new Date(),need=S.monthly>0&&!sub;
 A.innerHTML=`<h1>${esc(me.farm)}</h1>${msg?`<p class="mute" role="alert">${esc(msg)}</p>`:""}${S.monthly>0?`<div class="box row"><span>${sub?"Subscription active until "+new Date(me.sub_until).toLocaleDateString("en-GB"):"Monthly subscription: "+money(S.monthly)}</span><button class="btn sm" data-fee="monthly">${sub?"Renew":"Pay now"}</button></div>`:""}${need?"":`<form id="add" class="box"><h2>Add a product</h2>${S.post_fee>0?`<p class="mute">Posting fee: ${money(S.post_fee)} per product.</p>`:""}<input name="name" placeholder="Product" required><select name="category">${C.map(c=>`<option>${esc(c.name)}</option>`).join("")}</select><input name="price" type="number" min="1" placeholder="Price (₦)" required><input name="unit" placeholder="Unit, e.g. kg" required><input name="stock" type="number" min="1" placeholder="Quantity" required><button class="btn">List product</button></form>`}<h2>Your products</h2>${mine.map(p=>`<div class="row box"><span>${esc(p.name)}, ${money(p.price)}/${esc(p.unit)}<br><small class="mute">${p.live?(new Date(p.boost_until)>new Date()?"⭐ Featured":"Live"):(S.post_fee>0?"Pay the posting fee, or wait for approval":"Waiting for approval")}</small></span><span>${!p.live&&S.post_fee>0?`<button class="btn sm" data-fee="post" data-p="${p.id}">Pay ${money(S.post_fee)}</button>`:p.live&&S.boost_fee>0?`<button class="del" data-fee="boost" data-p="${p.id}">Boost ${money(S.boost_fee)}</button>`:""}</span></div>`).join("")||"<p class='mute'>Nothing listed yet.</p>"}${ordersBox()}<button class="del" data-out>Log out</button>`}
async function adminLoad(){const iso=new Date().toISOString();
 const[r,b,o,p,q]=await Promise.all([sb.from("reports").select("*").eq("status","open").order("created_at",{ascending:false}),sb.from("profiles").select("id,farm,banned_until,banned_full").or("banned_full.eq.true,banned_until.gt."+iso),sb.from("orders").select("commission,status,pay_method"),sb.from("banned_phones").select("*"),sb.from("products").select("*").eq("live",false).order("created_at",{ascending:false})]);
 R=r.data||[];PP=q.data||[];Bn=b.data||[];O=o.data||[];BP=(p.data||[]).filter(x=>x.full_ban||new Date(x.until)>new Date())}
const dt=t=>new Date(t).toLocaleDateString("en-GB");
function admin(){const com=O.filter(x=>x.status!="cancelled").reduce((a,x)=>a+x.commission,0);
$("#app").innerHTML=`<h1>Owner dashboard.</h1>${msg?`<p class="mute" role="alert">${esc(msg)}</p>`:""}<div class="box row"><span>Commission from online orders</span><b>${money(com)}</b></div><p class="mute">Pay-on-delivery orders: ${O.filter(x=>x.pay_method=="cod").length}, no commission.</p>
<form id="fees" class="box"><h2>Your fees</h2><p class="mute">Set a fee to 0 to make it free.</p><label class="mute">Monthly fee (₦)<input name="monthly" type="number" min="0" value="${S.monthly}"></label><label class="mute">Fee per post (₦)<input name="post_fee" type="number" min="0" value="${S.post_fee}"></label><label class="mute">Boost fee (₦)<input name="boost_fee" type="number" min="0" value="${S.boost_fee}"></label><label class="mute">Boost lasts (days)<input name="boost_days" type="number" min="1" value="${S.boost_days}"></label><label class="mute">Commission on online orders (%)<input name="comm" type="number" min="0" max="50" step="0.5" value="${S.comm}"></label><button class="btn">Save fees</button></form>
<h2>Products waiting (${PP.length})</h2>${PP.map(p=>`<div class="box"><b>${esc(p.name)}</b> <small class="mute">${esc(p.category||"")}</small><p class="mute">${esc(F[p.farmer_id]?.farm||"Farm")}, ${esc(F[p.farmer_id]?.town||"")}<br>${money(p.price)}/${esc(p.unit)}, ${p.stock} in stock</p><div class="row"><button class="btn sm" data-appr="${p.id}">Approve</button><button class="del" data-rej="${p.id}">Remove</button></div></div>`).join("")||"<p class='mute'>No products waiting.</p>"}
<h2>Reports (${R.length})</h2>${R.map(r=>`<div class="box"><b>${esc(r.label)}</b> <small class="mute">${esc(r.target_type)}</small><p class="mute">${esc(r.reason)}: ${esc(r.details)}<br>By ${esc(r.who)}, ${dt(r.created_at)}</p><div class="row"><input id="d_${r.id}" type="number" min="1" value="7" aria-label="Ban days" style="width:70px;margin:0"><button class="btn sm" data-ban="${r.id}|temp">Temporary ban (days)</button></div><div class="row" style="margin-top:8px"><button class="btn sm" data-ban="${r.id}|full">Ban permanently</button><button class="del" data-ban="${r.id}|dismiss">Dismiss</button></div></div>`).join("")||"<p class='mute'>No open reports.</p>"}
<h2>Banned</h2>${Bn.map(b=>`<div class="row box"><span>${esc(b.farm)}<br><small class="mute">farmer, ${b.banned_full?"permanently":"until "+dt(b.banned_until)}</small></span><button class="del" data-unban="f|${b.id}">Unban</button></div>`).join("")}${BP.map(b=>`<div class="row box"><span>${esc(b.label||b.phone)}<br><small class="mute">buyer, ${b.full_ban?"permanently":"until "+dt(b.until)}</small></span><button class="del" data-unban="b|${b.phone}">Unban</button></div>`).join("")}${Bn.length+BP.length?"":"<p class='mute'>Nobody is banned.</p>"}
<form id="bphone" class="box"><h2>Ban a buyer</h2><input name="phone" type="tel" placeholder="Buyer phone number" required><input name="days" type="number" min="1" placeholder="Days (leave empty for permanent)"><button class="btn">Ban buyer</button></form>
<h2>Categories</h2><form id="cats" class="box">${C.map(c=>`<div class="row" style="margin-bottom:8px"><input name="e${c.id}" value="${esc(c.icon)}" style="width:60px;margin:0;text-align:center" aria-label="Icon"><input name="n${c.id}" value="${esc(c.name)}" style="margin:0" aria-label="Name"><button type="button" class="del" data-rmcat="${c.id}">Remove</button></div>`).join("")}<div class="row" style="margin:8px 0 10px"><input name="ne" placeholder="🌱" style="width:60px;margin:0;text-align:center"><input name="nn" placeholder="New category" style="margin:0"><span></span></div><button class="btn">Save categories</button></form>`}
async function adm(fn){msg="";try{await fn()}catch(e){msg=e.message||"Something went wrong."}await load();tab="admin";admin()}
const ok=r=>{if(r.error)throw r.error};
const banAct=v=>adm(async()=>{const[id,mode]=v.split("|"),r=R.find(x=>x.id==id);if(!r)return;
 if(mode!="dismiss"){const days=Math.max(1,+($("#d_"+id)||{}).value||7),until=new Date(Date.now()+days*864e5).toISOString();
  if(r.target_type=="farmer")ok(await sb.from("profiles").update(mode=="full"?{banned_full:true}:{banned_until:until}).eq("id",r.target_key));
  else ok(await sb.from("banned_phones").upsert({phone:r.target_key,label:r.label,full_ban:mode=="full",until:mode=="full"?null:until}))}

const wa=p=>"https://wa.me/234"+String(p).slice(-10);

function ordersBox(){return `<h2 style="margin-top:22px">Orders for you</h2>${MO.map(o=>{const pend=o.pay_method=="online"&&!o.paid,s=o.status;return `<div class="box"><div class="row"><b>${esc(o.buyer_name)}</b><span class="mute">${pend?"Awaiting payment":STT[s]}</span></div><p class="mute"><a href="${wa(o.buyer_phone)}" target="_blank" rel="noopener">${esc(o.buyer_phone)} (WhatsApp)</a><br>${o.lines.map(l=>esc(l.t)).join("<br>")}<br>Deliver to ${esc(o.address)}<br>${o.pay_method=="online"?"Paid online, commission "+money(o.commission)+" deducted":"Pay on delivery, collect the cash"}</p><div class="row"><b>${money(o.total-o.commission)}</b><span>${pend||s=="delivered"||s=="cancelled"?"":s=="new"?`<button class="btn sm" data-st="${o.id}|accepted">Accept</button> <button class="del" data-st="${o.id}|cancelled">Can't fulfil</button>`:`<button class="btn sm" data-st="${o.id}|delivered">Mark delivered</button>`}</span></div><button class="del" data-repb="${o.id}" style="font-size:.78rem;margin-top:6px">Report buyer</button></div>`}).join("")||"<p class='mute'>Orders will show up here.</p>"}`}
function track(){const sv=localStorage.getItem("fd_code")||"";$("#app").innerHTML=`<h1>Track your order.</h1><form id="tr" class="box"><input name="phone" type="tel" placeholder="Phone number you ordered with" required><input name="code" placeholder="Order code" value="${esc(sv)}" required>${msg?`<p class="mute" role="alert">${esc(msg)}</p>`:""}<button class="btn">Show my order</button></form>${(TR||[]).map(o=>`<div class="box"><div class="row"><b>${esc(o.farm)}</b><span class="mute">${o.pay_method=="online"&&!o.paid?"Awaiting payment":STT2[o.status]}</span></div><p class="mute">${o.lines.map(l=>esc(l.t)).join("<br>")}</p><div class="row"><span class="mute">${o.pay_method=="online"?"Paid online":"Pay on delivery"}</span><b>${money(o.total)}</b></div></div>`).join("")}`}

document.addEventListener("click",async e=>{const d=e.target.closest("button")?.dataset||{};
 if(d.t){tab=d.t;msg="";if(d.t=="shop")cf=null;render()}else if(d.inc){cart[d.inc]=(cart[d.inc]||0)+1;shop()}else if(d.dec){if(--cart[d.dec]<=0)delete cart[d.dec];shop()}
